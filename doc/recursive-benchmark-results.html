.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    root.querySelector(&quot;#rbe-resources-context&quot;).textContent = `${fmt(mbps(displayed.maxIngress), 2)} Mbit/s maximum incoming; ${fmt(mbps(maximumEgress(displayed)), 2)} Mbit/s maximum outgoing when each root is sent to ${state.rootRecipients} of ${state.connectedPeers} connected peers.`;
    root.querySelector(&quot;#rbe-selection-note&quot;).textContent = selected
      ? &quot;Only the end-to-end runs shown here are eligible. At the same requested rate, selection prefers lower peak resident memory, followed by fewer threads and proving processes. The queue and timing graphs show the selected run.&quot;
      : &quot;The tables, queue graph, and timing graph show the closest measured candidate; it does not satisfy every selected limit.&quot;;
    if (!selected) {
      root.querySelector(&quot;#rbe-rejected-title&quot;).textContent = &quot;Why no tested configuration passes&quot;;
      root.querySelector(&quot;#rbe-rejected-detail&quot;).textContent = `Closest measured candidate: ${reasons(displayed).join(&quot;; &quot;)}.`;
      return;
    }
    root.querySelector(&quot;#rbe-rejected-title&quot;).textContent = &quot;Why the next tested rate fails&quot;;
    const failure = reasons(next);
    const differentSetup = next &amp;&amp; (next.threads !== displayed.threads || next.processes !== displayed.processes || next.leafRate !== displayed.leafRate)
      ? ` (different configuration: ${next.threads} thread${next.threads === 1 ? &quot;&quot; : &quot;s&quot;}, input-proof WHIR rate ${rateLabel(next.leafRate)})`
      : &quot;&quot;;
    root.querySelector(&quot;#rbe-rejected-detail&quot;).textContent = next
      ? `${fmt(next.requestedRate, 3)} requested inputs/s${differentSetup}: ${failure.length ? failure.join(&quot;; &quot;) : &quot;this run passes the selected limits, but a different tie-break selected the lower-RAM configuration&quot;}.`
      : &quot;No higher tested rate is available for this thread count, process count, and input-proof WHIR rate.&quot;;
  }
  function render() {
    valueLabels.workers.textContent = `${state.workers}`;
    valueLabels.deadline.textContent = `${fmt(state.deadline, 0)} s`;
    valueLabels.rootInterval.textContent = `${fmt(state.rootInterval, 1)} s`;
    valueLabels.ramGiB.textContent = `${fmt(state.ramGiB, 0)} GiB`;
    valueLabels.connectedPeers.textContent = `${state.connectedPeers}`;
    valueLabels.rootRecipients.textContent = `${state.rootRecipients}`;
    valueLabels.ingressMbps.textContent = `${fmt(state.ingressMbps, state.ingressMbps &lt; 10 ? 1 : 0)} Mbit/s`;
    valueLabels.egressMbps.textContent = `${fmt(state.egressMbps, state.egressMbps &lt; 10 ? 1 : 0)} Mbit/s`;
    const selected = selectedCandidate();
    const displayed = selected || closestCandidate();
    const next = nextFailed(displayed);
    renderSummary(selected, displayed, next); drawSearch(displayed); drawConstraintCharts(selected); drawQueue(displayed, next, Boolean(selected));
    renderLimits(displayed); drawTimings(displayed); renderTimings(displayed); renderTrees(displayed);
  }
  controls.workers.addEventListener(&quot;input&quot;, event =&gt; { state.workers = Number(event.target.value); render(); });
  controls.deadline.addEventListener(&quot;input&quot;, event =&gt; { state.deadline = Number(event.target.value); render(); });
  controls.rootInterval.addEventListener(&quot;input&quot;, event =&gt; { state.rootInterval = Number(event.target.value); render(); });
  controls.ramGiB.addEventListener(&quot;input&quot;, event =&gt; { state.ramGiB = Number(event.target.value); render(); });
  controls.connectedPeers.addEventListener(&quot;input&quot;, event =&gt; {
    const previousPeers = state.connectedPeers;
    const rootsSentToEveryPeer = state.rootRecipients === previousPeers;
    state.connectedPeers = Number(event.target.value);
    state.rootRecipients = rootsSentToEveryPeer ? state.connectedPeers : Math.min(state.rootRecipients, state.connectedPeers);
    controls.rootRecipients.max = state.connectedPeers;
    controls.rootRecipients.value = state.rootRecipients;
    render();
  });
  controls.rootRecipients.addEventListener(&quot;input&quot;, event =&gt; { state.rootRecipients = Number(event.target.value); render(); });
  controls.ingressMbps.addEventListener(&quot;input&quot;, event =&gt; { state.ingressMbps = 10 ** Number(event.target.value); render(); });
  controls.egressMbps.addEventListener(&quot;input&quot;, event =&gt; { state.egressMbps = 10 ** Number(event.target.value); render(); });
  const resize = new ResizeObserver(() =&gt; render());
  resize.observe(root.querySelector(&quot;#rbe-search-chart&quot;));
  resize.observe(root.querySelector(&quot;#rbe-constraint-charts&quot;));
  resize.observe(root.querySelector(&quot;#rbe-queue-chart&quot;));
  resize.observe(root.querySelector(&quot;#rbe-timing-chart&quot;));
  root.querySelector(&quot;#rbe-scope&quot;).textContent = `${DATA.tierLabel}. Hardware: ${DATA.hardware}.`;
  root.querySelector(&quot;#rbe-search-scope&quot;).textContent = `Tested coverage: ${DATA.searchDomain}.`;
  root.querySelector(&quot;#rbe-application-scope&quot;).textContent = `Workload: ${DATA.application}.`;
  root.querySelector(&quot;#rbe-network-scope&quot;).textContent = `Bandwidth calculation: ${DATA.networkAccounting}.`;
  root.querySelector(&quot;#rbe-selection-scope&quot;).textContent = `Selection: ${DATA.selectionRule}.`;
  render();
})();
&lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;
"></iframe>
